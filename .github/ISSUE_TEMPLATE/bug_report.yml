name: Bug report
description: Report a reproducible MAESTRO defect
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve MAESTRO. Please remove secrets and private data.
  - type: input
    id: version
    attributes:
      label: MAESTRO version / commit
      placeholder: v1.1.0 R1 or commit SHA
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: macOS / Linux / Windows + version
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Exact commands or steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs / evidence
      description: Remove credentials, tokens and private information.
